name: Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: false
        python-version: '3.13'
    - name: Build wheel
      run: uv build --wheel
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-wheel
        path: dist/*.whl
        if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: false
        python-version: '3.13'
    - name: Build source distribution
      run: uv build --sdist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  lint-dist:
    runs-on: ubuntu-latest
    needs: [build-wheel, build-sdist]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: false
        python-version: '3.13'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Rebuild wheel from source distribution
      run: uv build dist/*.tar.gz --wheel --out-dir "$RUNNER_TEMP/from-sdist"
    - name: Verify wheel and source installs
      run: |
        for format in whl tar.gz; do
          venv="$RUNNER_TEMP/install-$format"
          uv venv "$venv"
          uv pip install --python "$venv/bin/python" dist/*."$format"
          (cd "$RUNNER_TEMP" && "$venv/bin/python" -c 'import mistletoe; assert "<h1>Smoke test</h1>" in mistletoe.markdown("# Smoke test")')
        done
    - name: Check package metadata
      run: uv run --frozen --only-group package-lint twine check --strict dist/*.tar.gz dist/*.whl
    - name: Check distribution contents
      run: uv run --frozen --only-group package-lint pydistcheck --inspect dist/*.tar.gz dist/*.whl
    - name: Check source metadata
      run: uv run --frozen --only-group package-lint pyroma dist/*.tar.gz
    - name: Check wheel contents
      run: uv run --frozen --only-group package-lint check-wheel-contents dist/*.whl "$RUNNER_TEMP/from-sdist"/*.whl
    - name: Check source manifest
      run: uv run --frozen --only-group package-lint check-manifest -v
    - name: Verify release version
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: uv run --frozen --only-group package-lint python scripts/check_release_version.py "$TAG_NAME" dist

  attest:
    runs-on: ubuntu-latest
    needs: lint-dist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'miyuchina/mistletoe'
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Attest package provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          dist/*.tar.gz
          dist/*.whl

  publish-pypi:
    runs-on: ubuntu-latest
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'miyuchina/mistletoe'
    environment:
      name: pypi
      url: https://pypi.org/project/mistletoe/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Publish to PyPI with attestations
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        attestations: true

  publish-github-release:
    runs-on: ubuntu-latest
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'miyuchina/mistletoe'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if gh release view "$TAG_NAME" >/dev/null 2>&1; then
          echo "A release already exists for ${TAG_NAME}; inspect it before retrying." >&2
          exit 1
        fi
        gh release create "$TAG_NAME" --verify-tag --draft --generate-notes dist/*.whl dist/*.tar.gz
        gh release edit "$TAG_NAME" --draft=false
